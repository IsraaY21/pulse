name: pulse

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      PORT: 3000
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3001}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    environment:
      API_URL: http://api:3000
      BROWSER_API_URL: http://localhost:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3001"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
