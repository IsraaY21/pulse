name: pulse

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
